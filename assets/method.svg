<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" width="1240" height="330" role="img" aria-label="Method: Boston open data to one row per routine inspection with 17 inputs, into tabular models and a text branch, settings frozen before the test years, then evaluation on 2024 to November 2026.">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1220"/><stop offset="100%" stop-color="#0E1A2F"/></linearGradient>
    <linearGradient id="macc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <style>
      .n { font-family: ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif; font-size:14px; font-weight:700; fill:#F8FAFC; }
      .d { font-family: ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif; font-size:10.5px; fill:#94A3B8; }
      .k { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#FDBA74; letter-spacing:.5px; }
      .f { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10px; fill:#64748B; letter-spacing:.5px; }
    </style>
  </defs>
  <rect width="1240" height="330" rx="14" fill="url(#mbg)"/>
  <rect x="0" y="0" width="1240" height="3" rx="1.5" fill="url(#macc)"/>

  <rect x="40" y="110" width="186" height="76" rx="10" fill="#1E293B" stroke="#38BDF8"/>
  <text x="133" y="140" class="n" text-anchor="middle">Boston open data</text>
  <text x="133" y="159" class="d" text-anchor="middle">Food Establishment</text>
  <text x="133" y="174" class="d" text-anchor="middle">Inspections · PDDL</text>

  <rect x="274" y="110" width="186" height="76" rx="10" fill="#172033" stroke="#334155"/>
  <text x="367" y="140" class="n" text-anchor="middle">One row per</text>
  <text x="367" y="157" class="n" text-anchor="middle">inspection</text>
  <text x="367" y="176" class="d" text-anchor="middle">17 inputs · no owner names</text>

  <rect x="508" y="44" width="200" height="76" rx="10" fill="#172033" stroke="#334155"/>
  <text x="608" y="74" class="n" text-anchor="middle">Tabular models</text>
  <text x="608" y="93" class="d" text-anchor="middle">2 rules · logistic regression</text>
  <text x="608" y="108" class="d" text-anchor="middle">LightGBM · 4 more</text>

  <rect x="508" y="176" width="200" height="76" rx="10" fill="#172033" stroke="#334155"/>
  <text x="608" y="206" class="n" text-anchor="middle">Inspector comments</text>
  <text x="608" y="225" class="d" text-anchor="middle">MiniLM encoder, frozen</text>
  <text x="608" y="240" class="d" text-anchor="middle">and fine-tuned</text>

  <rect x="756" y="110" width="200" height="76" rx="10" fill="#7C2D12" stroke="#F97316"/>
  <text x="856" y="140" class="n" text-anchor="middle">🔒 Settings frozen</text>
  <text x="856" y="159" class="d" text-anchor="middle">before the test years</text>
  <text x="856" y="174" class="d" text-anchor="middle">were ever scored</text>

  <rect x="1004" y="110" width="196" height="76" rx="10" fill="#065F46" stroke="#10B981"/>
  <text x="1102" y="140" class="n" text-anchor="middle">Evaluation</text>
  <text x="1102" y="159" class="d" text-anchor="middle">train 2016–22 · tune 2023</text>
  <text x="1102" y="174" class="d" text-anchor="middle">test 2024 → Nov 2026</text>

  <g stroke="#94A3B8" stroke-width="1.6" fill="none" marker-end="url(#ma)">
    <path d="M226 148 H268"/>
    <path d="M460 148 H484 V82 H502"/>
    <path d="M460 148 H484 V214 H502"/>
    <path d="M708 82  H732 V148 H750"/>
    <path d="M708 214 H732 V148 H750"/>
    <path d="M956 148 H998"/>
  </g>

  <text x="40" y="288" class="k">A NUMBER YOU TUNED AGAINST IS NOT A RESULT.</text>
  <text x="40" y="308" class="f">ANYTHING ADDED AFTER THE FIRST TEST SCORING IS MARKED AS SUCH IN THE RESULTS TABLE.</text>
</svg>
